name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="${TAG_NAME#v}"
          actual="$(awk -F= '$1 == "version" {print $2}' apps/owner/RELEASE | sed 's/^v//')"
          test "$actual" = "$expected"
          test -f "docs/releases/${TAG_NAME}.md"

      - name: Run canonical source checks
        run: |
          FARYO_PYTHON="$(command -v python)" \
          FARYO_NODE_BIN="$(command -v node)" \
            scripts/check-source.sh

      - name: Build verified source installer assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          archive="faryo-$TAG_NAME.tar.gz"
          test -z "$(git ls-files -s | awk '$1 == 120000 {print}')"
          git archive --format=tar.gz --prefix="faryo-$TAG_NAME/" -o "dist/$archive" "$TAG_NAME"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          install -m 0755 scripts/install-faryo.sh dist/install-faryo.sh
          (cd dist && sha256sum install-faryo.sh > install-faryo.sh.sha256)

      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG_NAME.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Faryo ${TAG_NAME#v}" --notes-file "$notes"
          else
            gh release create "$TAG_NAME" --verify-tag --title "Faryo ${TAG_NAME#v}" --notes-file "$notes"
          fi
          gh release upload "$TAG_NAME" \
            "dist/faryo-$TAG_NAME.tar.gz" \
            "dist/faryo-$TAG_NAME.tar.gz.sha256" \
            dist/install-faryo.sh \
            dist/install-faryo.sh.sha256 \
            --clobber

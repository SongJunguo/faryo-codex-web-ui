[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faryo"
version = "1.11.8"
description = "Self-hosted Codex Web UI with App Server streaming and tmux compatibility"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "anyio==4.14.2",
  "bcrypt==5.0.0",
  "click==8.4.2",
  "h11==0.16.0",
  "idna==3.19",
  "starlette==1.6.0",
  "tomli==2.4.1; python_version < \"3.11\"",
  "uvicorn==0.52.4",
  "websockets==16.1.1",
]

[project.scripts]
faryo = "faryo_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [
  "apps/owner/local-tmux-owner/static/vendor",
]

[tool.ruff.lint]
select = ["E9", "F", "B"]
